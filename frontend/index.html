<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- ================= CREATE ================= -->

        <section class="card">

            <h2>Create Student</h2>

            <form id="createStudentForm">

                <input type="number" id="createId" placeholder="Student ID">

                <input type="text" id="createFirstName" placeholder="First Name">

                <input type="text" id="createLastName" placeholder="Last Name">

                <input type="email" id="createEmail" placeholder="Email">

                <input type="text" id="createPhone" placeholder="Phone">

                <input type="text" id="createBranch" placeholder="Branch">

                <button type="submit">Create Student</button>

            </form>

        </section>


        <!-- ================= READ ================= -->

        <section class="card">

            <h2>Read Student</h2>

            <input type="number" id="readId" placeholder="Student ID">

            <button id="readButton">Search</button>

        </section>


        <!-- ================= STUDENT DETAILS ================= -->

        <section class="card">

            <h2>Student Details</h2>

            <div id="studentDetails">

                <p>No Student Selected</p>

            </div>

        </section>


        <!-- ================= UPDATE ================= -->

        <section class="card">

            <h2>Update Student</h2>

            <form id="updateStudentForm">

                <input type="number" id="updateId" placeholder="Student ID">

                <input type="text" id="updateFirstName" placeholder="First Name">

                <input type="text" id="updateLastName" placeholder="Last Name">

                <input type="email" id="updateEmail" placeholder="Email">

                <input type="text" id="updatePhone" placeholder="Phone">

                <input type="text" id="updateBranch" placeholder="Branch">

                <button type="submit">Update Student</button>

            </form>

        </section>


        <!-- ================= DELETE ================= -->

        <section class="card">

            <h2>Delete Student</h2>

            <input type="number" id="deleteId" placeholder="Student ID">

            <button id="deleteButton">Delete Student</button>

        </section>


        <!-- ================= MESSAGE ================= -->

        <section class="card">

            <h2>Message</h2>

            <div id="messageBox">

                <p>No Message</p>

            </div>

        </section>

    </div>


    <script src="js/api.js"></script>
    <script src="js/create.js"></script>
    <script src="js/read.js"></script>
    <script src="js/update.js"></script>
    <script src="js/delete.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
